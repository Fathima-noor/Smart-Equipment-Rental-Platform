<nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm">
  <div class="container-fluid px-4">

    <!-- Brand -->
    <a
      class="navbar-brand fw-bold text-primary"
      routerLink="/"
    >
      <i class="bi bi-box-seam me-2"></i>
      EquipRent
    </a>


    <!-- Mobile menu button -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarContent"
    >
      <span class="navbar-toggler-icon"></span>
    </button>


    <div
      class="collapse navbar-collapse"
      id="navbarContent"
    >

      <!-- Right side -->
      <div class="ms-auto d-flex align-items-center gap-3">

        <!-- Theme Controls -->
<div class="theme-controls d-flex align-items-center gap-2">

  <button
    type="button"
    class="theme-btn"
    title="Light theme"
    aria-label="Light theme"
    (click)="setLightTheme()"
  >
    <i class="bi bi-sun"></i>
  </button>

  <button
    type="button"
    class="theme-btn"
    title="Dark theme"
    aria-label="Dark theme"
    (click)="setDarkTheme()"
  >
    <i class="bi bi-moon"></i>
  </button>

</div>


        <!-- Notification -->
        <div class="dropdown">

  <button
    class="btn btn-light position-relative"
    type="button"
    data-bs-toggle="dropdown"
  >

    <i class="bi bi-bell fs-5"></i>

    <span
      *ngIf="notificationCount > 0"
      class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
    >
      {{ notificationCount }}
    </span>

  </button>


  <div
    class="dropdown-menu dropdown-menu-end notification-menu shadow"
  >

    <div class="notification-header">

      <strong>
        Notifications
      </strong>

      <button
        *ngIf="notificationCount > 0"
        class="btn btn-sm btn-link"
        type="button"
        (click)="markAllAsRead()"
      >
        Mark all as read
      </button>

    </div>


    <div
      *ngIf="notifications.length === 0"
      class="notification-empty"
    >

      <i class="bi bi-bell-slash fs-3"></i>

      <p class="mb-0 mt-2">
        No notifications
      </p>

    </div>


    <button
      *ngFor="let notification of notifications"
      class="notification-item"
      [class.unread]="!notification.is_read"
      type="button"
      (click)="readNotification(notification)"
    >

      <div class="notification-icon">

        <i
          *ngIf="notification.notification_type === 'booking'"
          class="bi bi-calendar-check"
        ></i>

        <i
          *ngIf="notification.notification_type === 'payment'"
          class="bi bi-credit-card"
        ></i>

        <i
          *ngIf="notification.notification_type === 'damage'"
          class="bi bi-exclamation-triangle"
        ></i>

        <i
          *ngIf="notification.notification_type === 'equipment'"
          class="bi bi-box-seam"
        ></i>

        <i
          *ngIf="notification.notification_type === 'general'"
          class="bi bi-info-circle"
        ></i>

      </div>


      <div class="notification-content">

        <div class="notification-title">
          {{ notification.title }}
        </div>

        <div class="notification-message">
          {{ notification.message }}
        </div>

        <small class="text-muted">
          {{ notification.created_at | date:'short' }}
        </small>

      </div>

    </button>

    <!-- View All -->
    <div
      *ngIf="notifications.length > 0"
      class="notification-footer"
    >

      <button
        type="button"
        class="btn btn-sm btn-link text-decoration-none"
        (click)="viewAllNotifications()"
      >
        View all notifications
      </button>

    </div>

  </div>

</div>


        <!-- User -->
        <div class="dropdown">

          <button
            class="btn btn-light dropdown-toggle d-flex align-items-center gap-2"
            type="button"
            data-bs-toggle="dropdown"
          >

            <i class="bi bi-person-circle fs-5"></i>

            <!-- Current logged-in user's name -->
            <span>{{ userName }}</span>

          </button>


          <ul
            class="dropdown-menu dropdown-menu-end shadow-sm"
          >

            <!-- Profile -->
            <li>

              <a
                class="dropdown-item"
                (click)="goToProfile()"
                style="cursor: pointer;"
              >

                <i class="bi bi-person me-2"></i>

                Profile

              </a>

            </li>


            <li>
              <hr class="dropdown-divider">
            </li>


            <!-- Logout -->
            <li>

              <button
                class="dropdown-item text-danger"
                type="button"
                (click)="logout()"
              >

                <i class="bi bi-box-arrow-right me-2"></i>

                Logout

              </button>

            </li>

          </ul>

        </div>

      </div>

    </div>

  </div>
</nav>
